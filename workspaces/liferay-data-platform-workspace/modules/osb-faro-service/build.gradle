buildService {
	apiDir = "../osb-faro-api/src/main/java"
	databaseNameMaxLength = 64
}

dependencies {
	compileOnly group: "com.liferay.portal", name: "release.dxp.api", version: "default"
	compileOnly group: "jakarta.mail", name: "jakarta.mail-api", version: "2.1.3"
	compileOnly group: "jakarta.servlet", name: "jakarta.servlet-api", version: "6.0.0"
	compileOnly group: "junit", name: "junit", version: "4.13.1"
	compileOnly project(":modules:osb-faro-api")
}
