liferay-data-platform-site-initializer:
    name: Liferay Data Platform Site Initializer
    oAuthApplicationHeadlessServer: liferay-data-platform-oahs
    siteExternalReferenceCode: LIFERAY_DATA_PLATFORM
    siteName: Liferay Data Platform
    type: siteInitializer

liferay-data-platform-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay Data Platform OAuth Application Headless Server
    scopes:
        - Liferay.Headless.Site.everything
        - Liferay.Headless.Delivery.everything
        - Liferay.Headless.Admin.User.everything
    type: oAuthApplicationHeadlessServer
